# GitHub Pages 自动部署：每次 push 到 main 分支，GitHub 会自动执行
# npm install → npm run build → 把 dist/ 发布到你的 Pages 网址。
# 本项目是纯前端，用静态托管完全符合定位；数据仍在浏览器的 localStorage 里。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 给 Actions 开部署权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
